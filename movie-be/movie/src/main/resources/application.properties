spring.application.name=movie

# Render/Railway inject the listen port via $PORT; default to 8080 for local dev.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinenoir_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:MovieSecretKeyMovieSecretKeyMovieSecretKey123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Transactional email via Brevo's HTTPS API (see EmailService) — Render's free tier blocks
# outbound SMTP ports, so plain JavaMailSender/Gmail SMTP can't be used there. Left blank on
# purpose; real values only ever go in Render's Environment tab, never committed here.
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:CineNoir}

# Comma-separated list of allowed frontend origins for CORS (see SecurityConfig).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Movie video files can be large — default Spring Boot multipart limit is 1MB, far too small.
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
server.tomcat.max-swallow-size=-1

# PayOS payment gateway (https://payos.vn). Left blank on purpose — unlike the JWT/mail secrets
# above, real values must ONLY ever be set as Render env vars (or your own local shell env),
# never committed here. Payment endpoints fail fast with a clear error if these are blank.
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# Fallback base URL for PayOS returnUrl/cancelUrl if the frontend somehow omits one.
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
