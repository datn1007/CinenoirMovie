spring.application.name=movie

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinenoir_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:MovieSecretKeyMovieSecretKeyMovieSecretKey123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Required so Spring creates a JavaMailSender bean (EmailService depends on it directly,
# app fails to start without it). Fill in a real SMTP account to actually send OTP emails;
# for Gmail, username is the address and password is a 16-char App Password (not your login password).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:xuantuan240474@gmail.com}
spring.mail.password=${MAIL_PASSWORD:pfvm jqxu laue pvao}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Comma-separated list of allowed frontend origins for CORS (see SecurityConfig).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Movie video files can be large — default Spring Boot multipart limit is 1MB, far too small.
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
server.tomcat.max-swallow-size=-1
